name: Diff-Navigation CI/CD Pipeline

on:
  push:
    branches: [ "dev", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: diff-nav-test
  REGISTRY: ghcr.io

jobs:
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        cache: 'pip'

    - name: 安装代码检查工具
      run: |
        pip install pylint flake8 black isort
        pip install -r tests_auto/requirements.txt

    - name: 运行 Black 格式检查
      run: black --check --diff tests_auto/
      continue-on-error: true

    - name: 运行 Flake8 代码风格检查
      run: flake8 tests_auto/ --max-line-length=120 --statistics
      continue-on-error: true

    - name: 运行 Pylint 静态分析
      run: pylint tests_auto/ --disable=C0114,C0115,C0116 || true

  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        ros-distro: [noetic]
    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 构建测试环境镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: tests_auto/Dockerfile
        tags: ${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ github.sha }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 编译 ROS 工作空间
      run: |
        docker run --rm ${{ env.IMAGE_NAME }}:latest /bin/bash -c \
          "source /opt/ros/${{ matrix.ros-distro }}/setup.bash && catkin_make"

    - name: 运行单元测试并生成 HTML 报告
      run: |
        docker run --rm -v ${{ github.workspace }}/reports:/workspace/tests_auto/reports \
          ${{ env.IMAGE_NAME }}:latest /bin/bash -c \
          "source /opt/ros/${{ matrix.ros-distro }}/setup.bash && \
           pip install pytest-html && \
           pytest /workspace/tests_auto/ -v --html=/workspace/tests_auto/reports/report.html --self-contained-html"

    - name: 运行测试覆盖率分析
      run: |
        docker run --rm -v ${{ github.workspace }}/coverage:/workspace/coverage \
          ${{ env.IMAGE_NAME }}:latest /bin/bash -c \
          "source /opt/ros/${{ matrix.ros-distro }}/setup.bash && \
           pip install pytest-cov && \
           pytest /workspace/tests_auto/ --cov=/workspace/src --cov-report=html:/workspace/coverage --cov-report=term"
      continue-on-error: true

    - name: 归档测试报告与图表
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CI-Test-Reports-${{ matrix.ros-distro }}
        path: |
          reports/
          coverage/
        retention-days: 30

  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 构建测试镜像
      run: docker build -t ${{ env.IMAGE_NAME }}:latest -f tests_auto/Dockerfile .

    - name: 运行完整集成测试
      run: |
        docker run --rm ${{ env.IMAGE_NAME }}:latest /bin/bash -c \
          "source /opt/ros/noetic/setup.bash && \
           echo '🚁 集成测试：验证完整飞行流程' && \
           pytest /workspace/tests_auto/ -v --tb=long"

  build-release:
    name: 构建发布版本
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录 GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 提取元数据
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha

    - name: 构建并推送 Docker 镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: tests_auto/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://diff-navigation.example.com
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 部署通知
      run: |
        echo "🚀 部署版本: ${{ github.ref_name }}"
        echo "📦 镜像: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
        echo "📅 部署时间: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: 模拟部署流程
      run: |
        echo "执行部署命令..."
        echo "kubectl set image deployment/diff-nav app=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
        echo "✅ 部署完成"

  notify:
    name: 流水线状态通知
    runs-on: ubuntu-latest
    needs: [code-quality, build-and-test, integration-test]
    if: always()
    steps:
    - name: 检查流水线状态
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 CI/CD 流水线执行完成"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🔍 代码质量检查: ${{ needs.code-quality.result }}"
        echo "🏗️  构建与测试: ${{ needs.build-and-test.result }}"
        echo "🔗 集成测试: ${{ needs.integration-test.result }}"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
